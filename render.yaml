services:
  - type: web
    name: perxia-reto03-ordenes-compra
    runtime: node
    plan: free
    buildCommand: npm ci && npm run typecheck
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: MAX_ITER
        value: 25
      - key: MAX_TOKENS_SESION
        value: 150000
      - key: RATE_LIMIT_POR_MIN
        value: 10
      - key: LLM_TIMEOUT_MS
        value: 60000
      - key: GROQ_API_KEY
        sync: false
